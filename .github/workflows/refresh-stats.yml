# Refresh dashboard data
#
# Once a day (05:00 UTC) and on manual dispatch, this job rebuilds the guide
# dashboard numbers in mapdata/ (venue-stats.json, events-stats.json) from the
# KavaCrawl D1 database, runs the test suite, and commits mapdata/ only when it
# changed. When the private KavaCrawl repo can be read, it first refreshes the
# venue list (mapdata/venues.json) too. If the total guard refuses, a query
# fails, or a test fails, the job stops with an error and nothing is pushed.
#
# The repository owner must set up, under Settings > Secrets and variables > Actions:
#   - Secret CLOUDFLARE_API_TOKEN (create this): a read-only D1 token,
#     scope Account > D1 > Read, on the KavaCrawl Cloudflare account only.
#   - Secret KAVACRAWL_REPO_TOKEN (optional, create this): a fine-grained PAT with
#     Contents: Read-only on the repository Shapehaven-Innovations/KavaCrawl only,
#     so the venue list also refreshes. Without it, the committed
#     mapdata/venues.json is used as is.
#   - Already set: secret CLOUDFLARE_ACCOUNT_ID and repository variable D1_DATABASE_ID.

name: Refresh dashboard data

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secrets cannot be tested directly in `if`, so expose only whether the token exists.
      HAS_KC_TOKEN: ${{ secrets.KAVACRAWL_REPO_TOKEN != '' }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check out KavaCrawl (optional)
        if: env.HAS_KC_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: Shapehaven-Innovations/KavaCrawl
          token: ${{ secrets.KAVACRAWL_REPO_TOKEN }}
          path: kc
          persist-credentials: false

      - name: Refresh venue list (optional)
        if: env.HAS_KC_TOKEN == 'true'
        # kc/ is removed afterwards so `node --test` does not pick up the other repo's tests.
        run: |
          node scripts/build-data.mjs kc/menu_pipeline/venues.json
          rm -rf kc

      - name: Note committed venue list in use
        if: env.HAS_KC_TOKEN != 'true'
        run: echo "::notice::KAVACRAWL_REPO_TOKEN is not set; using the committed mapdata/venues.json as is."

      - name: Build dashboard stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/build-stats.mjs

      - name: Run tests
        run: node --test

      - name: Commit and push mapdata if changed
        run: |
          if [ -z "$(git status --porcelain -- mapdata)" ]; then
            echo "mapdata unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapdata
          git commit -m "$(date -u +%Y%d%m)-refresh dashboard data"
          git pull --rebase origin main
          git push
